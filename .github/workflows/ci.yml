name: CI

# 触发：推送到 main（质量门 + Pages 部署）、v* 标签（质量门 + Android 发版）、PR、手动。
# 网页产物（dist/）在 main 上自动部署到 GitHub Pages；
# Android 壳（android/）把 dist/ 打进 APK：main 上出 Debug 包，v* 标签出固定签名 Release 包。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次运行，推送密集时省机器也省等待。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: 校验 / 测试 / 构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      # css/tokens.css 是生成物。如果有人手改了它却忘了改生成器（或反之），
      # 明暗两套角色就会和生成器失配，而且不会报错——所以在 CI 里对账。
      - name: 校验设计令牌与生成器一致
        run: |
          node tools/generate-tokens.mjs
          if ! git diff --quiet -- css/tokens.css; then
            echo "::error file=css/tokens.css::css/tokens.css 与 tools/generate-tokens.mjs 不一致，请运行 npm run tokens 并提交"
            git diff --stat -- css/tokens.css
            exit 1
          fi
          echo "✓ tokens.css 与生成器一致"

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      # 产物结构是构建器的契约，坏了要在这里挡住，而不是等 Pages 上线后白屏。
      - name: 校验产物
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html 缺失"; exit 1; }
          grep -Eq 'href="\./app\.[0-9a-f]{10}\.css"' dist/index.html \
            || { echo "::error::index.html 未指向哈希化的 CSS"; exit 1; }
          grep -Eq 'src="\./app\.[0-9a-f]{10}\.js"' dist/index.html \
            || { echo "::error::index.html 未指向哈希化的 JS"; exit 1; }
          # 产物必须自包含：不允许残留指向 src/ 或远程 CDN 的引用
          if grep -Eq '(src|href)="(https?:)?//' dist/index.html; then
            echo "::error::产物中仍存在远程资源引用"; exit 1
          fi
          # 内联的主题引导脚本必须保留，否则首屏会闪一下错误主题
          grep -q 'zy2fa.theme' dist/index.html || { echo "::error::主题引导脚本丢失"; exit 1; }
          echo "✓ 产物校验通过"

      - name: 汇总产物
        run: |
          {
            echo "### 构建产物"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | ---: |"
            ( cd dist && ls -l --time-style=+ | awk 'NR>1 {printf "| `%s` | %s |\n", $NF, $5}' )
            echo
            echo "合计 $(du -sh dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: zy2fa-dist
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: 配置 Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 打包 Pages 站点
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------------------
  # Android 壳：把网页产物打进完全离线的 WebView APK（不申请 INTERNET 权限）
  android:
    name: 构建 Android APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 下载网页构建产物
        uses: actions/download-artifact@v7
        with:
          name: zy2fa-dist
          path: dist

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-34" "build-tools;34.0.0" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi

      # debug 包同样使用固定签名：还原 keystore 后，build.gradle 的 debug
      # buildType 会自动挂上同一把证书；Secret 缺失时退回默认调试签名并告警
      # （PR 来自 fork 等场景拿不到 Secrets，不能因此挡住质量门）
      - name: 还原固定签名 keystore（debug 包同样签名）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 等 Secret，本次 debug 包将使用随机调试签名（配置方法见 docs/SIGNING.md）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          {
            echo "KEYSTORE_PATH=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # 网页产物打进 APK 的 assets：App 完全离线，密钥不出设备
      - name: 填充网页资源
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          ls android/app/src/main/assets/www/

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # 输出 debug 包签名证书 SHA-256 到 Step Summary：应与 Release 包
      # 完全一致（固定校验值），证明固定签名在 debug 构建上同样生效
      - name: 校验签名指纹
        if: env.KEYSTORE_PATH != ''
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          SHA256=$(grep -oE 'SHA-256 digest: .*' certs.txt | head -1 | cut -d' ' -f3-)
          {
            echo "### Debug APK 签名指纹（固定校验值）"
            echo '```'
            echo "SHA-256: $SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 写入构建摘要
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZY2fa-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # v* 标签：构建固定签名的 Release APK 并发布到 GitHub Releases
  release:
    name: 发布 Release APK
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 下载网页构建产物
        uses: actions/download-artifact@v7
        with:
          name: zy2fa-dist
          path: dist

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      # 从仓库 Secret 还原固定发布 keystore（与其他三个 ZY 系列应用共用同一把，
      # 缺失则直接失败，绝不出随机签名的包；配置方法见 docs/SIGNING.md）
      - name: 还原固定签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::未配置 KEYSTORE_BASE64 等 Secret，无法产出签名固定的 Release 包（配置方法见 docs/SIGNING.md）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
          {
            echo "KEYSTORE_PATH=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 填充网页资源
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: 构建 Release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # 输出签名证书 SHA-256 到 Step Summary：这是固定校验值，
      # 每次发版应完全一致，用户可据此核对更新包来源
      - name: 校验签名指纹
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          SHA256=$(grep -oE 'SHA-256 digest: .*' certs.txt | head -1 | cut -d' ' -f3-)
          {
            echo "### 签名指纹（固定校验值）"
            echo '```'
            echo "SHA-256: $SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 重命名 APK（带版本号）
        run: |
          mkdir -p dist-apk
          for f in android/app/build/outputs/apk/release/*.apk; do
            mv "$f" "dist-apk/ZY2fa-${GITHUB_REF_NAME}-release.apk"
          done
          ls -lh dist-apk/

      - name: 创建 Release 并附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
