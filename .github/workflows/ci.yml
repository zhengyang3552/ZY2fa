name: CI

# 每次推送到 main、每个 PR 都跑：校验 → 测试 → 构建 → 发布产物。
# 构建产物（dist/）在 main 上自动部署到 GitHub Pages。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次运行，推送密集时省机器也省等待。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: 校验 / 测试 / 构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      # css/tokens.css 是生成物。如果有人手改了它却忘了改生成器（或反之），
      # 明暗两套角色就会和生成器失配，而且不会报错——所以在 CI 里对账。
      - name: 校验设计令牌与生成器一致
        run: |
          node tools/generate-tokens.mjs
          if ! git diff --quiet -- css/tokens.css; then
            echo "::error file=css/tokens.css::css/tokens.css 与 tools/generate-tokens.mjs 不一致，请运行 npm run tokens 并提交"
            git diff --stat -- css/tokens.css
            exit 1
          fi
          echo "✓ tokens.css 与生成器一致"

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      # 产物结构是构建器的契约，坏了要在这里挡住，而不是等 Pages 上线后白屏。
      - name: 校验产物
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html 缺失"; exit 1; }
          grep -Eq 'href="\./app\.[0-9a-f]{10}\.css"' dist/index.html \
            || { echo "::error::index.html 未指向哈希化的 CSS"; exit 1; }
          grep -Eq 'src="\./app\.[0-9a-f]{10}\.js"' dist/index.html \
            || { echo "::error::index.html 未指向哈希化的 JS"; exit 1; }
          # 产物必须自包含：不允许残留指向 src/ 或远程 CDN 的引用
          if grep -Eq '(src|href)="(https?:)?//' dist/index.html; then
            echo "::error::产物中仍存在远程资源引用"; exit 1
          fi
          # 内联的主题引导脚本必须保留，否则首屏会闪一下错误主题
          grep -q 'zy2fa.theme' dist/index.html || { echo "::error::主题引导脚本丢失"; exit 1; }
          echo "✓ 产物校验通过"

      - name: 汇总产物
        run: |
          {
            echo "### 构建产物"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | ---: |"
            ( cd dist && ls -l --time-style=+ | awk 'NR>1 {printf "| `%s` | %s |\n", $NF, $5}' )
            echo
            echo "合计 $(du -sh dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: zy2fa-dist
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: 配置 Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 打包 Pages 站点
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------------------------------------------------------------------------
  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
